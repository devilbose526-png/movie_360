<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTamil - Movie Reviews & API Search</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #e11d48;
      --subtext: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #020617;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    h1 { margin: 0; color: var(--accent-color); font-size: 2rem; }
    .search-container {
      max-width: 600px;
      margin: 30px auto;
      display: flex;
      gap: 10px;
      padding: 0 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 12px 24px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #be123c; }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .movie-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.3);
    }
    .movie-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    .movie-info {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .movie-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
    .movie-rating { color: #f59e0b; font-weight: bold; margin-bottom: 10px; }
    .movie-overview { font-size: 0.85rem; color: var(--subtext); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .status-text { text-align: center; color: var(--subtext); margin-top: 20px; }

    /* Detail Page View */
    .detail-container {
      max-width: 1000px;
      margin: 30px auto;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .detail-top {
      display: flex;
      gap: 30px;
    }
    .detail-poster {
      width: 320px;
      height: 460px;
      object-fit: cover;
      border-radius: 8px;
    }
    .detail-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .trailer-container {
      width: 100%;
      margin-top: 20px;
    }
    .trailer-container iframe {
      width: 100%;
      height: 450px;
      border-radius: 8px;
      border: none;
    }
    .back-btn {
      display: inline-block;
      margin: 20px 0 0 20px;
      padding: 8px 16px;
      background: #334155;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .back-btn:hover { background: #475569; }

    @media (max-width: 768px) {
      .detail-top { flex-direction: column; align-items: center; }
      .detail-poster { width: 100%; height: 380px; }
      .trailer-container iframe { height: 250px; }
    }
  </style>
</head>
<body>

  <header onclick="window.location.href='index.html'">
    <h1>🎬 CineTamil Review Hub</h1>
    <p style="color: var(--subtext); margin-top: 5px;">Search any movie globally using TMDB API</p>
  </header>

  <div id="mainContent">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Enter movie name (e.g., Leo, Jailer, Avatar)...">
      <button onclick="searchMovies()">Search</button>
    </div>

    <div id="status" class="status-text">Popular Trending Movies:</div>
    <div class="movies-grid" id="moviesGrid"></div>
  </div>

  <div id="detailView" style="display: none;">
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
    <div class="detail-container" id="detailCard"></div>
  </div>

  <script>
    const API_KEY = "9e9bb5d73d0a4ef2827da19c4c1643d2";
    let currentMoviesList = [];

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get("id");

      if (movieId) {
        fetchMovieDetails(movieId);
      } else {
        fetchTrendingMovies();
      }
    });

    async function fetchTrendingMovies() {
      const url = `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        currentMoviesList = data.results;
        displayMovies(currentMoviesList);
      } catch (err) {
        console.error(err);
      }
    }

    async function searchMovies() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) return;

      document.getElementById("status").innerText = `Searching results for: "${query}"...`;
      const url = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.results.length === 0) {
          document.getElementById("status").innerText = "No movies found!";
          document.getElementById("moviesGrid").innerHTML = "";
        } else {
          document.getElementById("status").innerText = `Search results for: "${query}"`;
          currentMoviesList = data.results;
          displayMovies(currentMoviesList);
        }
      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Error fetching movie data.";
      }
    }

    function displayMovies(movies) {
      const grid = document.getElementById("moviesGrid");
      grid.innerHTML = "";

      movies.items = movies;
      movies.forEach((movie) => {
        const poster = movie.poster_path 
          ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        const card = document.createElement("div");
        card.className = "movie-card";
        card.onclick = () => {
          window.location.href = `index.html?id=${movie.id}`;
        };
        card.innerHTML = `
          <img src="${poster}" alt="${movie.title}">
          <div class="movie-info">
            <div>
              <div class="movie-title">${movie.title}</div>
              <div class="movie-rating">⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'} / 10</div>
            </div>
            <div class="movie-overview">${movie.overview || 'No overview available.'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function fetchMovieDetails(id) {
      document.getElementById("mainContent").style.display = "none";
      document.getElementById("detailView").style.display = "block";

      const movieUrl = `https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}`;
      const videoUrl = `https://api.themoviedb.org/3/movie/${id}/videos?api_key=${API_KEY}`;

      try {
        const [movieRes, videoRes] = await Promise.all([
          fetch(movieUrl),
          fetch(videoUrl)
        ]);
        
        const movie = await movieRes.json();
        const videoData = await videoRes.json();

        const poster = movie.poster_path 
          ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        // Find YouTube Trailer
        let trailerHtml = "<p style='color: var(--subtext);'>No trailer available for this movie.</p>";
        if (videoData.results && videoData.results.length > 0) {
          const ytTrailer = videoData.results.find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser"));
          if (ytTrailer) {
            trailerHtml = `
              <h3 style="color: var(--accent-color); margin-bottom: 10px;">🎥 Official Trailer</h3>
              <div class="trailer-container">
                <iframe src="https://www.youtube.com/embed/${ytTrailer.key}" allowfullscreen></iframe>
              </div>
            `;
          }
        }

        document.getElementById("detailCard").innerHTML = `
          <div class="detail-top">
            <img src="${poster}" class="detail-poster" alt="${movie.title}">
            <div class="detail-info">
              <h2 style="margin: 0; color: var(--accent-color); font-size: 2rem;">${movie.title}</h2>
              <div style="color: var(--subtext); font-style: italic;">${movie.tagline || ''}</div>
              <div style="color: #f59e0b; font-weight: bold; font-size: 1.1rem;">⭐ Rating: ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'} / 10 (${movie.vote_count} votes)</div>
              <div style="color: var(--subtext);">📅 Release Date: ${movie.release_date || 'Unknown'}</div>
              <div style="color: var(--subtext);">⏳ Runtime: ${movie.runtime ? movie.runtime + ' mins' : 'N/A'}</div>
              <p style="line-height: 1.6; color: #cbd5e1; font-size: 1rem; margin-top: 5px;">${movie.overview || 'No description available.'}</p>
            </div>
          </div>
          ${trailerHtml}
        `;
      } catch (err) {
        console.error(err);
        document.getElementById("detailCard").innerHTML = "<p>Error loading movie details.</p>";
      }
    }
  </script>
</body>
</html>
